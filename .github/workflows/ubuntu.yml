name: Ubuntu

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  INSTALL_LOCATION: ${{ github.workspace }}/.local
  BUILD_TYPE: Release
  CTEST_OUTPUT_ON_FAILURE: 1
  PROJECT_NAME: ATLAS
  CPM_SOURCE_CACHE: ${{ github.workspace }}/cpm_modules

jobs:
  build:
    runs-on: ubuntu-24.04

    # Without a server every async integration suite runs zero tests, so the
    # layer that talks to PostgreSQL would go entirely unexercised in CI.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: "**/cpm_modules"
          key: ${{ github.workflow }}-cpm-modules-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates postgresql-common gcc-14 g++-14
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y libboost-all-dev libpq-dev pkg-config
          pkg-config --atleast-version=18 libpq

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_INSTALL_PREFIX=$INSTALL_LOCATION \
            -D${PROJECT_NAME}_ENABLE_TESTING=ON \
            -D${PROJECT_NAME}_ENABLE_STANDALONE=ON \
            -D${PROJECT_NAME}_ENABLE_CODE_COVERAGE=ON

      - name: Build
        run: cmake --build build --config $BUILD_TYPE -j$(nproc)

      - name: Test
        env:
          ATLAS_TEST_CONNINFO: "host=127.0.0.1 port=5432 user=atlas password=atlas dbname=atlas_test"
        run: ctest --test-dir build -C $BUILD_TYPE --output-on-failure

      - name: Install
        run: cmake --build build --target install --config $BUILD_TYPE

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
